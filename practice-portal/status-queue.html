<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application status queue | ProviderGate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Application status queue</h1>
  <p class="sub">This page is deliberately slow (1–3 seconds, random) to practise waits. Never use a fixed sleep here!</p>
  <div class="card">
    <div class="toolbar"><span class="muted" data-testid="load-time"></span><button type="button" class="secondary" data-testid="reload-queue">Refresh queue</button></div>
    <div class="loading" data-testid="spinner" role="progressbar" aria-label="Loading applications"><div class="spinner"></div><p>Loading applications…</p></div>
    <table class="hidden" data-testid="queue-table" aria-label="Application queue">
      <thead><tr><th>Application ID</th><th>Provider</th><th>Type</th><th>Submitted</th><th>Status</th></tr></thead>
      <tbody id="qRows"></tbody>
    </table>
  </div>
</main>
<footer>ProviderGate practice portal · fake data only</footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if (Portal.requireAuth()) {
  Portal.header("status-queue.html");
  var $ = function (t) { return document.querySelector("[data-testid=" + t + "]"); };
  function load() {
    var delay = 1000 + Math.floor(Math.random() * 2000);
    $("spinner").classList.remove("hidden"); $("queue-table").classList.add("hidden"); $("load-time").textContent = "";
    setTimeout(function () {
      var types = ["New enrollment", "Revalidation", "Change of information"];
      var rows = window.PROVIDERS.slice(0, 12).map(function (p, i) {
        var d = new Date(); d.setDate(d.getDate() - (i * 3 + 2));
        return '<tr data-testid="queue-row" id="' + Portal.rid("gvQueue_row") + '"><td data-testid="app-id">ENR-2026-' + (104800 + i * 17) + "</td><td>" +
          Portal.esc(p.firstName + " " + p.lastName) + "</td><td>" + types[i % 3] + "</td><td>" + Portal.fmtUS(d) + "</td><td>" + Portal.badge(p.enrollmentStatus) + "</td></tr>";
      });
      document.getElementById("qRows").innerHTML = rows.join("");
      $("spinner").classList.add("hidden"); $("queue-table").classList.remove("hidden");
      $("load-time").textContent = "Loaded in " + (delay / 1000).toFixed(1) + " s";
    }, delay);
  }
  $("reload-queue").addEventListener("click", load);
  load();
}
</script>
</body>
</html>
